name: Deploy Nidus to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Git LFS
        uses: git-lfs/setup-git-lfs@v3

      - name: Pull Git LFS files
        run: git lfs pull

      - name: Verify image files
        run: |
          echo "Checking source images..."
          find src/imports -type f \( -iname '*.jpeg' -o -iname '*.jpg' -o -iname '*.png' \) -exec ls -lh {} \;

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Vite app
        run: npm run build

      - name: Verify built images
        run: |
          echo "Checking built images..."
          find dist/assets -type f \( -iname '*.jpeg' -o -iname '*.jpg' -o -iname '*.png' \) -exec ls -lh {} \;

      - name: Verify built page metadata
        run: |
          grep -E '<title>|robots|favicon' dist/index.html || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
